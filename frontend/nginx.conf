log_format bbm '$remote_addr $host "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log bbm;

map $http_x_forwarded_proto $external_scheme {
    default http;
    https https;
}

server {
    listen 80 default_server;
    server_name _;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / { return 404; }
}

server {
    listen 80;
    server_name bbm.mauzo.tz;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/(api|admin|static|media|private_media)(/|$) { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name bbmapi.mauzo.tz;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;

    location /static/ {
        alias /srv/static/;
        expires 1h;
        autoindex off;
    }
    location /media/ {
        alias /srv/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location ~ ^/(api|admin)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
    location / { return 404; }
}
