services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    # Preserve development bind-mount writes; production uses the image's non-root user.
    user: "0:0"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  frontend:
    image: node:24-alpine
    working_dir: /app
    # Dev server only; a production build behind nginx comes later.
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Called from the browser, so this is the host-mapped backend port.
      VITE_API_URL: http://localhost:8000/api/v1
      # Put in links people are sent; the live site, as in production.
      VITE_APP_URL: https://bbm.mauzo.tz
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules: